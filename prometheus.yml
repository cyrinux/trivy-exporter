# Prometheus Configuration for Trivy Exporter
# Place this file at the root and mount it in the Prometheus container

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'trivy-exporter'

# Alerting (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

# Load alert rules (optional)
# rule_files:
#   - /etc/prometheus/rules/*.yml

scrape_configs:
  # Job to scrape Trivy Exporter metrics
  - job_name: 'trivy-exporter'
    static_configs:
      - targets: ['trivy-exporter:8080']
    
    # Increase timeout for long scans
    scrape_timeout: 30s
    
    # Metrics to collect
    metric_relabel_configs:
      # Keep only trivy_* metrics
      - source_labels: [__name__]
        regex: 'trivy_.*'
        action: keep

  # Prometheus itself (monitoring the monitoring)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

