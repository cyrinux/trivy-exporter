services:
  trivy-exporter:
    image: ghcr.io/cyrinux/trivy-exporter:latest
    build: .
    container_name: trivy-exporter
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Docker socket in read-only mode
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Trivy cache to avoid re-downloading vulnerability databases
      - trivy-cache:/root/.cache/trivy
      # SQLite database storage
      - trivy-results:/results
    environment:
      LOG_LEVEL: info
      NUM_WORKERS: "2"
      # Rescan every running container's image every 6 hours (0 disables)
      SCAN_INTERVAL_MINUTES: "360"
      # Custom Trivy arguments
      TRIVY_EXTRA_ARGS: --ignore-unfixed --severity HIGH,CRITICAL
      # Use a Trivy server instead of the embedded CLI database (optional)
      # TRIVY_SERVER_URL: http://trivy-server:4954
      # OpenAI for CVE analysis (optional)
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      # OPENAI_MODEL: gpt-4o-mini
      # ntfy.sh alerts (optional)
      # NTFY_WEBHOOK_URL: https://ntfy.sh/your-topic
      # Tracing/profiling are off by default; point them at your stack to enable
      DISABLE_TRACING_PROFILING: "true"
      # TEMPO_ENDPOINT: tempo:4317
      # PYROSCOPE_ENDPOINT: http://pyroscope:4040
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  # Optional: Trivy server so workers share one vulnerability database.
  # Pin the image to a digest; Trivy's release channels were compromised in 2026.
  # trivy-server:
  #   image: ghcr.io/aquasecurity/trivy:0.75.0
  #   command: ["server", "--listen", "0.0.0.0:4954"]
  #   volumes:
  #     - trivy-server-cache:/root/.cache/trivy

  # Optional observability stack
  # prometheus:
  #   image: prom/prometheus:latest
  #   ports: ["9090:9090"]
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus-data:/prometheus
  # grafana:
  #   image: grafana/grafana:latest
  #   ports: ["3000:3000"]
  #   volumes: ["grafana-data:/var/lib/grafana"]
  # tempo:
  #   image: grafana/tempo:latest
  #   ports: ["4317:4317", "3200:3200"]
  # pyroscope:
  #   image: grafana/pyroscope:latest
  #   ports: ["4040:4040"]

volumes:
  trivy-cache:
  trivy-results:
