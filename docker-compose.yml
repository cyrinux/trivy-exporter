version: '3.8'

services:
  # Main Trivy Exporter service
  trivy-exporter:
    image: ghcr.io/cyrinux/trivy-exporter:latest
    container_name: trivy-exporter
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Docker socket in read-only mode
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Trivy cache to avoid re-downloading vulnerability databases
      - trivy-cache:/root/.cache/trivy
      # SQLite database storage
      - trivy-results:/results
    environment:
      # Basic configuration
      - LOG_LEVEL=info
      - NUM_WORKERS=2
      
      # OpenAI for CVE analysis (optional)
      # Uncomment and set your API key
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - OPENAI_MODEL=gpt-4-turbo
      
      # ntfy.sh alerts (optional)
      # - NTFY_WEBHOOK_URL=https://ntfy.sh/your-topic
      
      # Custom Trivy arguments
      - TRIVY_EXTRA_ARGS=--ignore-unfixed --severity HIGH,CRITICAL
      
      # Disable tracing/profiling if not used
      - DISABLE_TRACING_PROFILING=true
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits (adjust according to your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # Example: Complete stack with Prometheus and Grafana (optional)
